# API de démonstration Sang+ sur Render (Blueprint).
# Render > New > Blueprint > choisir ce dépôt. Puis, sur Vercel, définir VITE_API_URL
# avec l'URL du service « sang-plus-api » et redéployer le front.
#
# Le schéma est appliqué et la démo réinitialisée à chaque démarrage : les données fictives
# sont datées par rapport au jour courant, la démo reste donc toujours à jour.
# Ne jamais utiliser cette configuration avec des données réelles (mode démo sans authentification).

databases:
  - name: sangplus-db
    plan: free
    region: frankfurt
    databaseName: sangplus
    user: sangplus

services:
  - type: web
    name: sang-plus-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: sangplus-db
          property: connectionString
